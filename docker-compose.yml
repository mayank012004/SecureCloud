name: cognito-auth

services:

  app:
    container_name: securecloud_app

    image: securecloud:latest

    depends_on:
      db:
        condition: service_healthy

    environment:
      APP_DEBUG: "true"
      APP_ENV: local
      APP_URL: http://127.0.0.1:8080

      COGNITO_DOMAIN: ${COGNITO_DOMAIN}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      COGNITO_CLIENT_SECRET: ${COGNITO_CLIENT_SECRET}
      COGNITO_REDIRECT_URI: http://127.0.0.1:8080/callback
      COGNITO_LOGOUT_URI: http://127.0.0.1:8080/login

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "8080:80"

    networks:
      - securecloud_network


  db:
    container_name: securecloud_db

    image: mysql:8.4

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      timeout: 5s
      interval: 5s
      retries: 20

    ports:
      - "3307:3306"

    restart: unless-stopped

    volumes:
      - securecloud_mysql_data:/var/lib/mysql

    networks:
      - securecloud_network


networks:
  securecloud_network:
    name: cognito-auth_securecloud_network
    driver: bridge


volumes:
  securecloud_mysql_data:
    name: cognito-auth_securecloud_mysql_data
    driver: local
